# Copy this file to config.toml and edit it in the project directory.

[app]
data_dir = "data"
lock_path = "data/device.lock"

[server]
# false keeps the module monitor running without opening any HTTP,
# REST, SSE, WebSocket, OpenAPI, or static web-console listening socket.
enabled = true
host = "127.0.0.1"
port = 8787
allow_service_restart = false
systemd_unit = "djisimhub.service"
public_base_url = "https://djihub.fubuki.app"

[logging]
# INFO records lifecycle/call/module events in journald. Use DEBUG temporarily
# when collecting a diagnostic log, then return to INFO.
level = "INFO"

[security]
# Failed Bearer authentication attempts are counted per source address in
# memory. The triggering request receives HTTP 429 with Retry-After.
auth_max_failures = 10
auth_failure_window_seconds = 300
auth_block_seconds = 900

[calls]
# Multiply PCM amplitude in BOTH directions; 0=mute, 1=unchanged. Restart required.
audio_gain = 1.0
incoming_frontend = "app" # app (PushKit/CallKit), web, or auto
# auto selects app; use server.enabled=true for client calls.

[module]
# The first audio session validates kernel 3.18.44, hashes, module-side ALSA
# endpoints and VoLTE ACDB before enabling this call-scoped route.
voice_manifest = "resources/module-voice/manifest.json"
voice_resource_dir = "resources/module-voice"

[network]
# Omit apn to preserve the modem configuration (default).
# apn = "connect" # Manual APN; use the value required by your operator.
# apn = ""        # Request the subscription default APN, if supported.
pdp_type = "IP"   # IP, IPV6, or IPV4V6; applies only when apn is configured.
# Applied by network-setup --confirm or module-setup --confirm, never on startup.

[apns]
enabled = false
sandbox = true
# Enabling APNs requires all four fields below. Keep the private key outside Git.
# key_path = "secrets/AuthKey.p8"
# key_id = "APPLE_KEY_ID"
# team_id = "APPLE_TEAM_ID"
# bundle_id = "your.app.bundle"
