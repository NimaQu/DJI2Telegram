[project]
name = "DJI2Telegram"
version = "0.4.0"
description = "Headless Linux QDC507 gateway for Telegram and web clients"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "libusb1>=3.2",
  "pyudev>=0.24",
  "pyalsaaudio>=0.11",
  "kurigram>=1.2",
  "tgcrypto>=1.2.5",
  "py-tgcalls>=2.2",
  "ntgcalls>=2.2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[project.scripts]
dji2telegram = "qdc507_gateway.cli:main"
dji2telegram-server = "qdc507_gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdc507_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
